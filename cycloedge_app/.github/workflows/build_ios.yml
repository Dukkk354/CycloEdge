name: Build iOS (.ipa) & Android (.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (No-Mac Cloud Build)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Locate Flutter App Directory
        id: app-dir
        run: |
          if [ -d "cycloedge_app" ]; then
            echo "dir=cycloedge_app" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.app-dir.outputs.dir }}
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        working-directory: ${{ steps.app-dir.outputs.dir }}
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Installable .ipa
        working-directory: ${{ steps.app-dir.outputs.dir }}
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr CycloEdge-iOS.ipa Payload
          echo "IPA Package generated at build/ios/iphoneos/CycloEdge-iOS.ipa"

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloEdge-iOS-ipa
          path: ${{ steps.app-dir.outputs.dir }}/build/ios/iphoneos/CycloEdge-iOS.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Locate Flutter App Directory
        id: app-dir
        run: |
          if [ -d "cycloedge_app" ]; then
            echo "dir=cycloedge_app" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.app-dir.outputs.dir }}
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ${{ steps.app-dir.outputs.dir }}
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloEdge-Android-apk
          path: ${{ steps.app-dir.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
